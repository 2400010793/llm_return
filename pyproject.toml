[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-return"
version = "0.1.0"
description = "Chinese equity news embedding and expected-return research"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
