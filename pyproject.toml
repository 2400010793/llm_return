[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-return"
version = "0.1.0"
description = "Chinese equity news embedding and expected-return research"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "pyyaml>=6",
  "tqdm>=4.65",
  "joblib>=1.3",
  "jieba>=0.42",
  "statsmodels>=0.14",
  "gensim>=4.3",
  "tabulate>=0.9",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.2",
  "transformers>=4.40",
  "safetensors>=0.4",
  "sentence-transformers>=2.7",
]
boosting = [
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
]
research = [
  "umap-learn>=0.5.12",
  "hdbscan>=0.8.42",
  "pypdf>=5.0",
  "akshare>=1.17",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]
report = [
  "Markdown>=3.9",
  "matplotlib>=3.9",
  "WeasyPrint>=65",
  "pypdf>=5.0",
  "plotly>=5.20",
]
browser = [
  "playwright>=1.45,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
llm-return = "src.cli:main"

[tool.uv]
# Keep the project environment in the repository's conventional .venv path.
# Large model/data directories remain outside the repository and are configured
# through configs/paths.yaml or command-line arguments.
package = true
default-groups = ["dev"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
